[package]
name = "maild-ui"
version = "0.1.0"
edition = "2021"
description = "Maild 默认前端的 Tauri 壳：以 frontend:com.maild.ui 主体连接 daemon（ADR-0024/0031）"
license = "MIT OR Apache-2.0"
# Binary names come from brand.toml (see the generated block below).
autobins = false
publish = false

# BEGIN GENERATED BRAND BINS
# Generated by scripts/sync-brand.sh from brand.toml. Do not edit by hand.
[[bin]]
name = "featherpost-ui"
path = "src/main.rs"
# END GENERATED BRAND BINS

[features]
default = []
# 交付形态：把 packages/maild-ui/dist 编进二进制。tauri 的 codegen 只在这个形态检查前端产物
# 是否存在，所以 `cargo test --workspace` 的默认形态永远不需要 Node（ADR-0031 决策 2）。
embedded = ["tauri/custom-protocol"]

[dependencies]
maild-brand = { path = "../maild-brand" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# ADR-0033 决策 4：文档令牌用系统随机源。
getrandom = "0.4.3"
# ADR-0033 决策 3：HTML5 流式重写器——映射 cid:/链接、去势脚本与远程引用，未触碰的字节原样输出。
lol_html = "2"
maild-app = { path = "../maild-app" }
maild-client = { path = "../maild-client" }
# ADR-0044：单实例锁位于平台 runtime 目录。
maild-paths = { path = "../maild-paths" }
regex = "1"
# ADR-0033 决策 8：系统保存面板（与 maild-launcher 同一套 rfd feature 组合）。
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ADR-0044：第二个实例把已有主窗口带到前台（与 tauri 同一 objc2 版本，不引入新 crate）。
# ADR-0045：窗口回到前台 / 关闭撤下时激活与交还前台（NSApplication，主线程标记来自 objc2）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
maild = { path = "../maild" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
