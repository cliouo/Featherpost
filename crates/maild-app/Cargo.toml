[package]
name = "maild-app"
version = "0.1.0"
edition = "2021"
description = "Framework-neutral maild desktop application state and connection actor"
license = "MIT OR Apache-2.0"

[dependencies]
maild-brand = { path = "../maild-brand" }
maild-client = { path = "../maild-client" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
