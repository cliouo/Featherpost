[package]
name = "maild"
version = "0.1.0"
edition = "2021"
description = "maild 守护进程：loader（TOML 声明式配置）+ 配置装配"
license = "MIT OR Apache-2.0"
# Binary names come from brand.toml (see the generated block below).
autobins = false

# BEGIN GENERATED BRAND BINS
# Generated by scripts/sync-brand.sh from brand.toml. Do not edit by hand.
[[bin]]
name = "featherpostd"
path = "src/bin/maild.rs"

[[bin]]
name = "featherpost-agent"
path = "src/bin/maild-agent.rs"

[[bin]]
name = "featherpostctl"
path = "src/bin/maildctl.rs"
# END GENERATED BRAND BINS

[dependencies]
maild-brand = { path = "../maild-brand" }
cordis = { path = "../cordis" }
# ADR-0032：附件字节分块 base64 走既有 JSON-RPC 帧
base64 = "0.22"
async-imap = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4.3"
maild-client = { path = "../maild-client" }
maild-paths = { path = "../maild-paths" }
mailparse = "0.16"
plist = "1"
native-tls = "0.2"
regex = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6.1"
tempfile = "3.27"
zeroize = "1.9.0"
# preserve_order：装配顺序 = 配置文件书写顺序（loader 的确定性承诺）
toml = { version = "0.9", features = ["preserve_order"] }
# io-std：api 插件 JSON-RPC over stdio 用 stdin/stdout
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "io-std", "sync", "signal", "process"] }
tokio-native-tls = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSRunningApplication", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 仅 api.rs 的 #[cfg(test)] 用到 HTTP 客户端；生产守护进程不链接它（ADR-0041 决策 7）。
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# 假邮件服务器：自签证书（纯 Rust）+ rustls（ring，TLS1.2+）
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
