[package]
name = "maild-proxy"
version = "0.1.0"
edition = "2021"
description = "Featherpost shared proxy core: model, bypass matcher, OS system proxy detection, HTTP CONNECT / HTTPS / SOCKS5(h) tunnel connector, and optional reqwest adapter"
license.workspace = true

[features]
default = []
# Phase 3 consumers (maild-ui, plugins/nodeseek-email) enable this; featherpost-agent keeps default features so it does not link reqwest (ADR-0041).
reqwest = ["dep:reqwest", "dep:url", "dep:percent-encoding"]

[dependencies]
base64 = "0.22"
ipnet = "2"
native-tls = "0.2"
percent-encoding = { version = "2", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["socks"], optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
tokio-native-tls = "0.3"
url = { version = "2", optional = true }
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
