[package]
name = "maild-launcher"
version = "0.1.0"
edition = "2021"
description = "Native Maild recovery and background controls, independent of frontend packages"
license = "MIT OR Apache-2.0"
# Binary names come from brand.toml (see the generated block below).
autobins = false

# BEGIN GENERATED BRAND BINS
# Generated by scripts/sync-brand.sh from brand.toml. Do not edit by hand.
[[bin]]
name = "featherpost-launcher"
path = "src/main.rs"
# END GENERATED BRAND BINS

[dependencies]
maild-brand = { path = "../maild-brand" }
clap = { version = "4", features = ["derive"] }
maild = { path = "../maild" }
maild-client = { path = "../maild-client" }
maild-l10n = { path = "../maild-l10n" }
maild-paths = { path = "../maild-paths" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = { version = "0.9", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "block2", "NSApplication", "NSAlert", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
