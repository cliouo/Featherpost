[package]
name = "maild-client"
version = "0.1.0"
edition = "2021"
description = "maild JSON-RPC client shared by CLI and desktop frontends"
license = "MIT OR Apache-2.0"

[dependencies]
maild-brand = { path = "../maild-brand" }
maild-paths = { path = "../maild-paths" }
# ADR-0032：附件字节分块 base64 走既有 JSON-RPC 帧
base64 = "0.22"
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "io-util"] }
toml = { version = "0.9", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt", "sync"] }
