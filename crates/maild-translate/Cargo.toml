[package]
name = "maild-translate"
version = "0.4.0"
edition = "2021"
description = "Featherpost pure-Rust email translation core engine: provider contract, OpenAI-compatible provider, secure config store, SQLite cache, and lightweight language detector"
license.workspace = true

[dependencies]
async-trait = "0.1"
cordis = { path = "../cordis" }
getrandom = "0.4.3"
hex = "0.4"
lol_html = "2"
maild-proxy = { path = "../maild-proxy", features = ["reqwest"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "socks"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
toml = { version = "0.9", features = ["preserve_order"] }
url = "2"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
tempfile = "3.27"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
