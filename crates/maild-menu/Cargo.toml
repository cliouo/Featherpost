[package]
name = "maild-menu"
version = "0.1.0"
edition = "2021"
description = "Supervised macOS menu-bar companion for maild"
license = "MIT OR Apache-2.0"
# Binary names come from brand.toml (see the generated block below).
autobins = false

# BEGIN GENERATED BRAND BINS
# Generated by scripts/sync-brand.sh from brand.toml. Do not edit by hand.
[[bin]]
name = "featherpost-menu"
path = "src/main.rs"
# END GENERATED BRAND BINS

[dependencies]
maild-brand = { path = "../maild-brand" }
maild-client = { path = "../maild-client" }
maild-l10n = { path = "../maild-l10n" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSLocale", "NSNotification", "NSObject", "NSString"] }
