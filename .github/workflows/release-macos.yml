name: macOS Release Gate

# Tag-push trigger disabled to save GitHub Actions minutes; run manually from the Actions tab (select the tag ref).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and verify macOS
    runs-on: macos-15
    environment: macos-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load brand names
        shell: bash
        run: |
          set -euo pipefail
          # brand.env is generated from brand.toml; artifact names below never hard-code a brand.
          . packaging/macos/brand.env
          for key in BRAND_PRODUCT_NAME BRAND_SLUG BRAND_APP_BUNDLE; do
            printf '%s=%s\n' "$key" "${!key}" >>"$GITHUB_ENV"
          done
      - name: Reject invalid tag and provisional identities
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          printf '%s\n' "$version" | LC_ALL=C grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          # brand.toml drift is gated by `scripts/sync-brand.sh --check` (ci.yml `brand` job, manual-only); packaging
          # additionally refuses *-bundle-id.txt that differ from brand.env (verify-bundle.sh).
          . packaging/macos/brand.env
          for pair in "App:app" "Agent:agent" "Menu:menu"; do
            id=$(cat "packaging/macos/${pair#*:}-bundle-id.txt")
            case "$id" in
              "dev.$BRAND_SLUG".*|dev.maild.*)
                printf 'provisional %s bundle identifier is forbidden: %s\n' "${pair%%:*}" "$id" >&2
                exit 1
                ;;
            esac
          done
          team_id=$(cat packaging/macos/team-id.txt)
          test "$(wc -l < packaging/macos/team-id.txt)" -eq 1
          case "$team_id" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          test "$team_id" != UNSET
          printf '%s\n' "$team_id" | LC_ALL=C grep -Eq '^[A-Z0-9]{10}$'
      # Rust (clippy + universal2 targets), Node, and pnpm are pinned in mise.toml.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: rust node pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Test workspace and packaging before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          bash -n packaging/macos/*.sh packaging/macos/tests/*.sh
          packaging/macos/tests/test_bundle.sh
          packaging/macos/tests/test_release.sh
          packaging/macos/tests/test_lifecycle.sh
      - name: Prepare pnpm and test Tauri UI webview packages
        shell: bash
        run: |
          set -euo pipefail
          # Versions come from mise.toml (installed by mise-action above).
          node --version
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm --dir packages/maild-ui typecheck
          pnpm --dir packages/maild-ui test
          pnpm --dir packages/featherpost-studio typecheck
          pnpm --dir packages/featherpost-studio build
      - name: Build universal2 release candidate
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          mkdir -p "$RUNNER_TEMP/release-unsigned"
          chmod 0700 "$RUNNER_TEMP/release-unsigned"
          packaging/macos/build-universal.sh \
            --short-version "$version" \
            --build-version "$version" \
            --output "$RUNNER_TEMP/release-unsigned/$BRAND_APP_BUNDLE"
          packaging/macos/release-bundle.sh \
            --app "$RUNNER_TEMP/release-unsigned/$BRAND_APP_BUNDLE" \
            --version "$version" \
            --preflight-only
      - name: Import Developer ID certificate
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PATH
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          certificate="$RUNNER_TEMP/release-developer-id.p12"
          keychain_password=$(/usr/bin/openssl rand -hex 32)
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/openssl base64 -d -A >"$certificate"
          /bin/chmod 0600 "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          printf 'RELEASE_KEYCHAIN=%s\n' "$keychain" >>"$GITHUB_ENV"
          /bin/rm -f -- "$certificate"
      - name: Materialize notary API key
        shell: bash
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PATH
          notary_key="$RUNNER_TEMP/release-notary-key.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/openssl base64 -d -A >"$notary_key"
          /bin/chmod 0600 "$notary_key"
          printf 'RELEASE_NOTARY_KEY_PATH=%s\n' "$notary_key" >>"$GITHUB_ENV"
      - name: Sign, notarize, staple, and verify
        shell: bash
        env:
          # Brand-neutral repository variables (see docs/operations/README.md).
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PATH
          version=${GITHUB_REF_NAME#v}
          /bin/mkdir -p "$RUNNER_TEMP/release-output"
          /bin/chmod 0700 "$RUNNER_TEMP/release-output"
          packaging/macos/release-bundle.sh \
            --app "$RUNNER_TEMP/release-unsigned/$BRAND_APP_BUNDLE" \
            --version "$version" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --keychain "$RELEASE_KEYCHAIN" \
            --notary-key "$RELEASE_NOTARY_KEY_PATH" \
            --notary-key-id "$MACOS_NOTARY_KEY_ID" \
            --notary-issuer "$MACOS_NOTARY_ISSUER_ID" \
            --output-dir "$RUNNER_TEMP/release-output"
      - name: Remove release credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export PATH
          keychain="${RELEASE_KEYCHAIN:-$RUNNER_TEMP/release-signing.keychain-db}"
          if ! /usr/bin/security delete-keychain "$keychain" >/dev/null 2>&1; then
            /bin/rm -f -- "$keychain"
          fi
          /bin/rm -f -- \
            "${RELEASE_NOTARY_KEY_PATH:-$RUNNER_TEMP/release-notary-key.p8}" \
            "$RUNNER_TEMP/release-developer-id.p12"
          for secret_file in \
            "$keychain" \
            "${RELEASE_NOTARY_KEY_PATH:-$RUNNER_TEMP/release-notary-key.p8}" \
            "$RUNNER_TEMP/release-developer-id.p12"; do
            test ! -e "$secret_file"
            test ! -L "$secret_file"
          done
      - name: Recheck the allowlisted release files after credential cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          release_dir="$RUNNER_TEMP/release-output"
          archive="$BRAND_PRODUCT_NAME-v$version-universal2.zip"
          checksum="$archive.sha256"
          notary="$BRAND_PRODUCT_NAME-v$version-notary.plist"
          for leaf in "$archive" "$checksum" "$notary"; do
            test -f "$release_dir/$leaf"
            test ! -L "$release_dir/$leaf"
          done
          (cd "$release_dir" && /usr/bin/shasum -a 256 -c "$checksum")
      - name: Upload verified release candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BRAND_PRODUCT_NAME }}-${{ github.ref_name }}-macos
          path: |
            ${{ runner.temp }}/release-output/${{ env.BRAND_PRODUCT_NAME }}-${{ github.ref_name }}-universal2.zip
            ${{ runner.temp }}/release-output/${{ env.BRAND_PRODUCT_NAME }}-${{ github.ref_name }}-universal2.zip.sha256
            ${{ runner.temp }}/release-output/${{ env.BRAND_PRODUCT_NAME }}-${{ github.ref_name }}-notary.plist
          if-no-files-found: error
