name: CI

# Automatic triggers disabled to save GitHub Actions minutes; run manually from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand:
    name: Brand sync (brand.toml -> derived files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tool versions come from mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: Check generated brand files are in sync with brand.toml
        run: bash scripts/sync-brand.sh --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Rust (with clippy and the universal2 targets), Node, and pnpm are pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: ${{ runner.os == 'macOS' && 'rust node pnpm' || 'rust' }}
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Tauri UI webview package
        if: runner.os == 'macOS'
        run: |
          pnpm --dir packages/maild-ui install --frozen-lockfile
          pnpm --dir packages/maild-ui exec tsc --noEmit -p tsconfig.json
          pnpm --dir packages/maild-ui test
      - name: Test macOS packaging scripts
        if: runner.os == 'macOS'
        run: |
          bash -n packaging/macos/*.sh packaging/macos/tests/*.sh
          packaging/macos/tests/test_bundle.sh
          packaging/macos/tests/test_release.sh
          packaging/macos/tests/test_lifecycle.sh
      - name: Build and verify actual universal2 bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Every artifact name comes from brand.env (generated from brand.toml).
          . packaging/macos/brand.env
          package_dir="$RUNNER_TEMP/$BRAND_SLUG-package"
          app="$package_dir/$BRAND_APP_BUNDLE"
          dmg="$package_dir/$BRAND_PRODUCT_NAME-preview.dmg"
          mkdir -p "$package_dir"
          chmod 0700 "$package_dir"
          packaging/macos/build-universal.sh --output "$app"
          packaging/macos/verify-bundle.sh "$app"
          packaging/macos/build-preview-dmg.sh --app "$app" --output "$dmg"
          hdiutil verify "$dmg"
