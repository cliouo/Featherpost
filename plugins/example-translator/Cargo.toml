[package]
name = "featherpost-example-translator"
version = "0.1.0"
edition = "2021"
description = "Minimal runnable external translation provider plugin example for Featherpost"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "example-translator"
path = "src/main.rs"

[dependencies]
maild-brand = { path = "../../crates/maild-brand" }
maild-client = { path = "../../crates/maild-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1.9.0"
